name: Publish
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC npm publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Check whether this version is already published
        id: registry
        run: |
          node <<'JS'
          const fs = require('fs');
          const { name, version } = require('./package.json');
          (async () => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
            if (response.status !== 200 && response.status !== 404)
              throw new Error(`Registry check failed: HTTP ${response.status}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
      - run: npm ci
        if: steps.registry.outputs.published != 'true'
      - run: npm publish --access public
        if: steps.registry.outputs.published != 'true'
